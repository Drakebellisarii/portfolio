<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drake Bellisari - Portfolio</title>
    <meta name="description" content="Drake Bellisari is a software engineer and Trinity College computer science graduate building web products for people. Work, education, projects, and a way to get in touch." />
    <meta name="theme-color" content="#06080c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Drake Bellisari - Portfolio" />
    <meta property="og:description" content="Software engineer and Trinity College computer science graduate building web products for people." />
    <meta property="og:image" content="%PUBLIC_URL%/media/hero/poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="%PUBLIC_URL%/logo.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Critical assets: the hero poster and the display font are requested
         before the JavaScript bundle is even parsed. -->
    <link rel="preload" href="%PUBLIC_URL%/media/hero/poster.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="%PUBLIC_URL%/fonts/DMSerifText-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/DMSerifText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Rubik is only for the Queralt card (Queralt's web typeface), so it loads
         without blocking the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <style>
      @font-face {
        font-family: 'DM Serif Text';
        src: url('%PUBLIC_URL%/fonts/DMSerifText-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'DM Serif Text';
        src: url('%PUBLIC_URL%/fonts/DMSerifText-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      html { background: #06080c; }
      /* Until React mounts, the preloaded hero poster fills the viewport behind
         the same tint the hero uses, so the first picture lands within the
         first round-trips instead of after the JavaScript bundle. */
      #root:empty {
        min-height: 100vh;
        background:
          linear-gradient(rgba(0, 0, 0, 0.64), rgba(0, 0, 0, 0.64)),
          url('%PUBLIC_URL%/media/hero/poster.jpg') center / cover no-repeat;
      }
    </style>

    <!-- Google tag (gtag.js), loaded after the page so analytics never competes with first paint -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-W563QJ9RYQ');
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-W563QJ9RYQ';
        document.head.appendChild(s);
      });
    </script>
  </head>
  <body>
    <noscript>
      <style>
        .noscript-container {
          font-family: sans-serif;
          padding: 2rem;
          max-width: 600px;
          margin: 3rem auto;
          background: #f9f9f9;
          border-radius: 12px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          text-align: center;
        }
        .noscript-container h1 { font-size: 1.8rem; margin-bottom: 1rem; }
        .noscript-container p { margin: 0.5rem 0; color: #333; }
        .noscript-container a { color: #0077ff; text-decoration: none; font-weight: bold; }
      </style>
      <div class="noscript-container">
        <h1>Drake Bellisari</h1>
        <p>Hi 👋, thanks for visiting my site!</p>
        <p>I'm a software engineer and Computer Science graduate. You can still reach me here:</p>
        <p>
          💼 <a href="https://www.linkedin.com/in/drake-bellisari/">LinkedIn</a><br>
          🖥️ <a href="https://github.com/DrakeBellisarii">GitHub</a>
        </p>
        <p>If you enable JavaScript, you'll see the full site with my projects and portfolio.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
